name: Unpack Drop

on:
  push:
    branches: [ main ]
    paths:
      - "drop/*.zip"

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack archives
        run: |
          set -e
          for archive in drop/*.zip; do
            unzip -o -q "$archive" -x ".github/*" -d .
            git rm -q -f "$archive"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack native drop" || exit 0
          git push

      - name: Start native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-build.yml --ref main
