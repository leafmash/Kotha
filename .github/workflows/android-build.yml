name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - "js/**"
      - "css/**"
      - "index.html"
      - "manifest.json"
      - "resources/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check secrets and variables
        env:
          APP_URL: ${{ vars.APP_URL }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/ci/check-secrets.py

      - name: Install dependencies
        run: npm install

      - name: Generate icon and splash sources
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make-resources.py

      - name: Build www assets
        run: npm run build:www

      - name: Inject API base into web assets
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python3 scripts/ci/inject-web-config.py

      - name: Add or sync Android platform
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Set version code and name
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ vars.VERSION_NAME }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: python3 scripts/ci/inject-version.py

      - name: Inject APK installer support
        run: python3 scripts/ci/inject-apk-installer.py

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Patch splash screen theme
        run: python3 scripts/ci/inject-splash-theme.py

      - name: Inject notification icon
        run: python3 scripts/ci/inject-notification-icon.py

      - name: Inject notification sound
        run: python3 scripts/ci/inject-notification-sound.py

      - name: Inject app strings
        run: python3 scripts/ci/inject-strings.py

      - name: Inject chat notification reply
        run: python3 scripts/ci/inject-chat-reply.py

      - name: Inject battery optimization permission
        run: python3 scripts/ci/inject-battery-permission.py

      - name: Inject call permissions
        run: python3 scripts/ci/inject-call-permissions.py

      - name: Add google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Add google-services Gradle plugin
        run: python3 scripts/ci/inject-google-services.py

      - name: Enable Google Sign-In native dependencies
        run: python3 scripts/ci/inject-android-variables.py

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Inject signing config
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/ci/inject-signing-config.py

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: kotha-apk
          path: android/app/build/outputs/apk/release/*.apk
