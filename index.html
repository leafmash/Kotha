<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>কথা</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1L4 21l3.9-1.9c1.3.5 2.7.8 4.1.8 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg></div>
  <div class="spin"></div>
</div>
<section id="auth">
  <div class="auth-card">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1L4 21l3.9-1.9c1.3.5 2.7.8 4.1.8 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg></div>
    <h1 class="brand">কথা</h1>
    <p class="tag">আপনার ইমেইল দিয়ে সাইন ইন করে কথা শুরু করুন।</p>
    <form id="authForm">
      <input id="name" placeholder="আপনার নাম" autocomplete="name" hidden>
      <input id="email" type="email" placeholder="ইমেইল" autocomplete="email" required>
      <input id="password" type="password" placeholder="পাসওয়ার্ড" minlength="6" autocomplete="current-password" required>
      <button class="primary" id="authBtn">সাইন ইন করুন</button>
    </form>
    <button class="ghost" id="googleBtn">Google দিয়ে চালিয়ে যান</button>
    <p class="switch"><span id="switchText">নতুন ব্যবহারকারী?</span> <a href="#" id="switchLink">অ্যাকাউন্ট খুলুন</a></p>
    <p class="err" id="authErr"></p>
  </div>
</section>

<script>(function(){var s=localStorage.getItem("kotha-session")==="1";document.getElementById("splash").hidden=!s;document.getElementById("auth").hidden=s})()</script>

<main id="app" hidden>
  <nav id="rail">
    <div class="rail-top">
      <button class="rbtn on" data-f="all" title="চ্যাট"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1L4 21l3.9-1.9c1.3.5 2.7.8 4.1.8 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg><span class="rbadge" id="railBadge" hidden></span></button>
      <button class="rbtn" data-f="group" title="গ্রুপ"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6 6 0 0 1 3.5 6"/></svg></button>
    </div>
    <div class="rail-bottom">
      <button class="rprofile" id="railMe" title="ছবি বদলান"><img id="railImg" alt=""></button>
    </div>
  </nav>
  <aside id="sidebar">
    <header>
      <b class="dtitle">চ্যাট</b>
      <div class="me" id="meBtn" title="ছবি বদলান"><img id="meImg" alt=""><b id="meName"></b></div>
      <div class="actions">
        <button id="addBtn" title="কন্টাক্ট যোগ করুন"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg></button>
        <button id="menuBtn" title="আরও" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><circle class="fill" cx="12" cy="5" r="1.8"/><circle class="fill" cx="12" cy="12" r="1.8"/><circle class="fill" cx="12" cy="19" r="1.8"/></svg></button>
      </div>
      <div id="moreMenu" hidden role="menu"></div>
    </header>
    <div class="search"><input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="কথোপকথন খুঁজুন"></div>
    <div class="chips" id="chips"><button data-f="all" class="on">সব</button><button data-f="unread">অপঠিত</button></div>
    <div id="list"></div>
    <nav id="tabs">
      <button class="on" data-f="all"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1L4 21l3.9-1.9c1.3.5 2.7.8 4.1.8 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg><span>চ্যাট</span><i class="tbadge" id="tabBadge" hidden></i></button>
      <button data-f="group"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6 6 0 0 1 3.5 6"/></svg><span>গ্রুপ</span></button>
    </nav>
  </aside>

  <section id="chat">
    <div id="empty">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1L4 21l3.9-1.9c1.3.5 2.7.8 4.1.8 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg></div>
      <h2>কথা</h2>
      <p>বামের তালিকা থেকে একটি চ্যাট বেছে নিন</p>
    </div>
    <div id="pane" hidden>
      <header>
        <button id="backBtn" title="ফিরে যান"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="av" id="peerAv"><img id="peerImg" alt=""></div>
        <div class="who"><b id="peerName"></b><small id="peerStatus"></small></div>
      </header>
      <div id="messages"></div>
      <button id="fab" hidden title="নিচে যান"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div id="replyBar" hidden><div><small>উত্তর দিচ্ছেন</small><p id="replyText"></p></div><button id="replyCancel" title="বাতিল"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="emojiPanel" hidden></div>
      <footer>
        <button id="emojiBtn" title="ইমোজি"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></button>
        <button id="attachBtn" title="ফাইল"><svg viewBox="0 0 24 24"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10 17.5a2 2 0 0 1-3-3l7.5-7.5"/></svg></button>
        <textarea id="input" rows="1" placeholder="মেসেজ"></textarea>
        <div id="rec"><i></i><span id="recTime">0:00</span><button id="recCancel" title="বাতিল"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <button id="micBtn" title="ভয়েস মেসেজ"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button id="sendBtn" class="send" hidden title="পাঠান"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </footer>
    </div>
  </section>
</main>

<div id="sheet" hidden>
  <div class="panel">
    <header>
      <button id="sheetClose" title="ফিরে যান"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ht"><b>নতুন গ্রুপ</b><small id="sheetCount">মেম্বার বেছে নিন</small></div>
      <button id="sheetDone" class="text off">তৈরি করুন</button>
    </header>
    <div class="gbody">
      <div class="gname">
        <div class="gicon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6 6 0 0 1 3.5 6"/></svg></div>
        <input id="groupName" placeholder="গ্রুপের নাম" maxlength="40" autocomplete="off">
      </div>
      <div id="pickedSec" hidden><div id="picked"></div></div>
      <div class="gsearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="groupFind" type="search" inputmode="email" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="ইমেইল দিয়ে কন্টাক্ট খুঁজুন">
      </div>
      <div id="groupFindResult"></div>
      <div class="glabel" id="membersLabel">আপনার কন্টাক্ট</div>
      <div id="members"></div>
    </div>
  </div>
</div>
<div id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
  <div class="dialog">
    <div class="dicon" id="confirmIcon"></div>
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="dbtns">
      <button class="dcancel" id="confirmCancel">বাতিল</button>
      <button class="dok" id="confirmOk"></button>
    </div>
  </div>
</div>
<div id="choice" hidden role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
  <div class="dialog">
    <div class="dicon" id="choiceIcon"></div>
    <h3 id="choiceTitle"></h3>
    <p id="choiceText"></p>
    <div class="dbtns col" id="choiceBtns"></div>
  </div>
</div>
<div id="msgMenu" hidden role="dialog" aria-modal="true">
  <div class="menu">
    <div class="mreacts" id="menuReacts"></div>
    <div class="mpreview" id="menuPreview"></div>
    <div class="mitems" id="menuItems"></div>
  </div>
</div>
<div id="findSheet" hidden>
  <div class="panel">
    <header>
      <button id="findClose" title="ফিরে যান"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ht"><b>কন্টাক্ট যোগ করুন</b></div>
    </header>
    <div class="findbox">
      <div class="gsearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="findInput" type="search" inputmode="email" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="name@example.com">
      </div>
      <p class="fhint">যাকে যোগ করতে চান তার পুরো ইমেইল ঠিকানা লিখুন। নাম দিয়ে কাউকে খোঁজা যায় না।</p>
      <div id="findResult"></div>
    </div>
  </div>
</div>
<div id="lightbox" hidden><img alt=""></div>
<div id="toast"></div>
<input type="file" id="fileInput" hidden>
<input type="file" id="avatarInput" accept="image/*" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
